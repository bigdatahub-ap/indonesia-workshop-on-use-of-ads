server {
    listen 80;

    # Requests for the bare path (no trailing slash) must redirect *before*
    # the prefix is stripped, otherwise relative links on the page would
    # resolve against the domain root instead of /material/workshop-on-scanner-data/.
    location = /material/workshop-on-scanner-data {
        return 301 /material/workshop-on-scanner-data/;
    }

    location /material/workshop-on-scanner-data/ {
        proxy_pass http://site:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
